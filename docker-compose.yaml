networks:
  app-network:
    driver: bridge

services:
  # ==========================================
  # 1. СЕРВИС
  # ==========================================
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service-app
    ports:
      - "50051:50051" # gRPC
      - "2112:2112"   # Метрики Prometheus
    environment:
      - GRPC_PORT=50051
      - POSTGRES_DSN=postgres://users_db:users_db@postgres:5432/users_db?sslmode=disable
      - REDIS_ADDRS=redis-1:7001,redis-2:7002,redis-3:7003
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - CACHE_TTL=5m
    networks:
      - app-network
    depends_on:
      postgres-primary:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started

  # ==========================================
  # 2. БАЗЫ ДАННЫХ (МАСШТАБИРОВАНИЕ) И КЭШ (МАСШТАБИРОВАНИЕ)
  # ==========================================
  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    environment:
      POSTGRES_USER: users_db
      POSTGRES_PASSWORD: users_db
      POSTGRES_DB: users_db
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth=md5"
    entrypoint: ["bash", "-c"]
    command:
      - |
        docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c password_encryption=md5 &
        PID=$$!
        
        until [ -f /var/lib/postgresql/data/pg_hba.conf ]; do
          sleep 1
        done
        
        echo "host replication users_db 0.0.0.0/0 md5" >> /var/lib/postgresql/data/pg_hba.conf
        pg_ctl -D /var/lib/postgresql/data reload
        
        wait $$PID
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    environment:
      POSTGRES_USER: users_db
      POSTGRES_PASSWORD: users_db
      POSTGRES_DB: users_db
    command: |
      bash -c "
        # Полная очистка директории данных
        find /var/lib/postgresql/data -mindepth 1 -delete
        
        echo 'Ожидание готовности мастера для бэкапа репликации...'
        until PGPASSWORD=users_db pg_basebackup -h postgres-primary -p 5432 -U users_db -D /var/lib/postgresql/data -Fp -Xs -P -R; do
          echo 'Мастер еще не готов, повторная попытка через 2 секунды...'
          sleep 2
        done
        
        # Назначаем права пользователя postgres на директорию с данными
        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 0700 /var/lib/postgresql/data
        
        # Запускаем PostgreSQL от имени непривилегированного пользователя postgres
        exec gosu postgres postgres
      "
    ports:
      - "5433:5432"
    networks:
      - app-network
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_db"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    environment:
      - DB_HOST=postgres-primary
      - DB_USER=users_db
      - DB_PASSWORD=users_db
      - DB_NAME=users_db
      - LISTEN_PORT=6432          # <--- Явно указываем слушать порт 6432 изнутри
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
    ports:
      - "6432:6432"
    networks:
      - app-network
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ==========================================
  # REDIS CLUSTER (3 Мастера)
  # ==========================================
  redis-1:
    image: redis:7.2-alpine
    container_name: redis-1
    ports:
      - "7001:7001"
      - "17001:17001"
    command: >
      redis-server --port 7001 --cluster-enabled yes 
      --cluster-config-file nodes.conf --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-hostname redis-1 
      --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-2:
    image: redis:7.2-alpine
    container_name: redis-2
    ports:
      - "7002:7002"
      - "17002:17002"
    command: >
      redis-server --port 7002 --cluster-enabled yes 
      --cluster-config-file nodes.conf --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-hostname redis-2 
      --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-3:
    image: redis:7.2-alpine
    container_name: redis-3
    ports:
      - "7003:7003"
      - "17003:17003"
    command: >
      redis-server --port 7003 --cluster-enabled yes 
      --cluster-config-file nodes.conf --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-hostname redis-3 
      --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-4:
    image: redis:7.2-alpine
    container_name: redis-4
    ports:
      - "7004:7004"
      - "17004:17004"
    command: >
      redis-server --port 7004 --cluster-enabled yes 
      --cluster-config-file nodes.conf --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-hostname redis-4 
      --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7004 --cluster-announce-bus-port 17004
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-5:
    image: redis:7.2-alpine
    container_name: redis-5
    ports:
      - "7005:7005"
      - "17005:17005"
    command: >
      redis-server --port 7005 --cluster-enabled yes 
      --cluster-config-file nodes.conf --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-hostname redis-5 
      --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7005 --cluster-announce-bus-port 17005
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-6:
    image: redis:7.2-alpine
    container_name: redis-6
    ports:
      - "7006:7006"
      - "17006:17006"
    command: >
      redis-server --port 7006 --cluster-enabled yes 
      --cluster-config-file nodes.conf --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-hostname redis-6 
      --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7006 --cluster-announce-bus-port 17006
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Инициализатор кластера Redis
  # Инициализатор кластера Redis
  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-4:
        condition: service_healthy
      redis-5:
        condition: service_healthy
      redis-6:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
        echo 'Ждем запуск узлов Redis...'
        sleep 3
        echo 'Создаем кластер Redis...'
        yes yes | redis-cli --cluster create redis-1:7001 redis-2:7002 redis-3:7003 redis-4:7004 redis-5:7005 redis-6:7006 --cluster-replicas 1
        echo 'Redis Cluster успешно создан!'
      "

  # ==========================================
  # 3. KAFKA CLUSTER (KRaft - 3 Брокера)
  # ==========================================
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    ports:
      - "9091:9091"
    environment:
      CLUSTER_ID: '4L62xD12T_a107740TQNtw'
      KAFKA_CLUSTER_ID: '4L62xD12T_a107740TQNtw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9091'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://127.0.0.1:9091'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    ports:
      - "9092:9094"
    environment:
      CLUSTER_ID: '4L62xD12T_a107740TQNtw'
      KAFKA_CLUSTER_ID: '4L62xD12T_a107740TQNtw'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://127.0.0.1:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    ports:
      - "9093:9093"
    environment:
      CLUSTER_ID: '4L62xD12T_a107740TQNtw'
      KAFKA_CLUSTER_ID: '4L62xD12T_a107740TQNtw'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://127.0.0.1:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  # Инициализатор топиков Kafka
  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: init-kafka
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - app-network
    entrypoint: [ '/bin/sh', '-c' ]
    command: >
      "
      echo 'Ждем 10 секунд пока поднимется кластер Kafka...'
      sleep 10
      echo 'Создаем топик user-events...'
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic user-events --partitions 3 --replication-factor 3
      echo 'Готово! Топик создан.'
      "

  # ==========================================
  # 4. МОНИТОРИНГ
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network
    depends_on:
      - user-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app-network
    depends_on:
      - prometheus

  # ==========================================
  # 5. МИГРАТОР
  # ==========================================
  migrator:
    build: .
    entrypoint: ["/root/migrator"]
    command: ["-dsn", "postgres://users_db:users_db@postgres-primary:5432/users_db?sslmode=disable"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - app-network

  # ==========================================
  # 6. ТЕСТОВЫЙ РАННЕР
  # ==========================================
  test-runner:
    image: golang:1.25-alpine
    container_name: user-service-tests
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod   # <--- Кеш Go-модулей, чтобы не качать заново
    environment:
      - SERVICE_TEST_POSTGRES_DSN=postgres://users_db:users_db@pgbouncer:6432/users_db?sslmode=disable
      - POSTGRES_MASTER_DSN=postgres://users_db:users_db@pgbouncer:6432/users_db?sslmode=disable
      - POSTGRES_SLAVE_DSN=postgres://users_db:users_db@postgres-replica:5432/users_db?sslmode=disable
      - SERVICE_TEST_REDIS_ADDR=redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      - SERVICE_TEST_KAFKA_BROKERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks:
      - app-network
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy   # <--- Ждем, пока PgBouncer полностью готов принимать трафик
      migrator:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
      init-kafka:
        condition: service_completed_successfully

volumes:
  pgdata-primary:
  pgdata-replica:
  go-mod-cache: